[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgpm"
version = "0.1.0"
description = "Manage a project's roadmap, weekly plan and updates in a Telegram group (forum topics)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
tgpm = "tgpm.cli:main"

[tool.setuptools]
packages = ["tgpm"]
